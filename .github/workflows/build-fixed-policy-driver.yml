name: "Build: Cua Driver (fixed policy)"

# Builds the universal CuaDriver.app with the `fixed-policy` feature, the way
# cd-rust-cua-driver.yml builds the release app, without Developer ID signing
# or notarization: the app is signed ad hoc and carries its own bundle id, so
# macOS privacy grants never confuse it with the release app. The end-to-end
# tests in libs/cua-driver/scripts/tests/test_fixed_policy_macos.py run
# against the built app on the runner. The `release` job publishes the tested
# archive (SHA256SUMS, Sigstore bundles and a build-provenance attestation)
# only when dispatched with `release: true`.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the tested build as a release of this repository"
        type: boolean
        default: false
      bundle_id:
        description: "CFBundleIdentifier of the built app (default com.trycua.driver.fixedpolicy)"
        type: string
        default: ""
      release_tag:
        description: "Release tag (default cua-driver-rs-v<cua-driver version>-fixedpolicy.1)"
        type: string
        default: ""
  # A workflow_dispatch workflow must exist on the default branch before it can
  # be dispatched; until then, and on every other branch, a push that touches
  # the driver or this workflow runs the build and tests.
  push:
    branches-ignore: [main]
    paths:
      - "libs/cua-driver/**"
      - ".github/workflows/build-fixed-policy-driver.yml"

permissions:
  contents: read

concurrency:
  group: build-fixed-policy-driver-${{ github.ref }}
  cancel-in-progress: false

env:
  # Cua programs run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  BUNDLE_ID: ${{ inputs.bundle_id || 'com.trycua.driver.fixedpolicy' }}

jobs:
  build-test:
    name: build and test (darwin-universal)
    # macos-26: screencapturekit's Swift bridge needs the macOS 26 SDK
    # (see cd-rust-cua-driver.yml).
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || { echo "invalid bundle_id: $BUNDLE_ID" >&2; exit 2; }
          [[ "$BUNDLE_ID" != com.trycua.driver && "$BUNDLE_ID" != com.trycua.driver.local ]] \
            || { echo "bundle_id must differ from the release and local apps" >&2; exit 2; }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy, rustfmt

      # The app version is the cua-driver package version; the release tag
      # must name it.
      - name: Version and release tag
        id: version
        working-directory: libs/cua-driver/rust
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cua-driver") | .version')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "unexpected cua-driver version: $VERSION" >&2; exit 2; }
          TAG="${RELEASE_TAG_INPUT:-cua-driver-rs-v${VERSION}-fixedpolicy.1}"
          BUILD="${TAG#"cua-driver-rs-v${VERSION}-fixedpolicy."}"
          [[ "$BUILD" != "$TAG" && "$BUILD" =~ ^[0-9]+$ ]] \
            || { echo "release_tag must be cua-driver-rs-v${VERSION}-fixedpolicy.<n>, got $TAG" >&2; exit 2; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Lint and unit-check both builds
        working-directory: libs/cua-driver/rust
        run: |
          cargo fmt --check
          cargo clippy --locked -p cua-driver -p cua-driver-core --all-targets -- -D warnings
          cargo clippy --locked -p cua-driver -p cua-driver-core --all-targets \
            --features cua-driver/fixed-policy -- -D warnings
          cargo clippy --locked -p cua-driver-core --no-default-features \
            --features fixed-policy -- -D warnings
          # The default build's policy and authorization tests: the feature
          # must leave its behavior unchanged. (They set the policy
          # environment variables, which a fixed-policy build ignores.)
          cargo test --locked -p cua-driver-core --lib -- policy:: authorization::

      - name: Build arm64 and x86_64 with the fixed-policy feature
        working-directory: libs/cua-driver/rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked -p cua-driver -p cursor-theme-cli --release \
              --features cua-driver/fixed-policy --target "$target"
          done

      - name: Assemble and ad hoc sign CuaDriver.app
        working-directory: libs/cua-driver/rust
        run: |
          set -euo pipefail
          mkdir -p release/universal
          for bin in cua-driver cua-cursor-theme; do
            lipo -create "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" -output "release/universal/$bin"
            lipo -info "release/universal/$bin"
          done
          APP=release/CuaDriver.app
          mkdir -p "$APP"
          cp -R scripts/CuaDriverBundle/Contents "$APP/Contents"
          rm -f "$APP/Contents/MacOS/.gitkeep"
          cp release/universal/cua-driver release/universal/cua-cursor-theme "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/cua-driver" "$APP/Contents/MacOS/cua-cursor-theme"
          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/cua-driver" --version | grep -Fx "cua-driver $VERSION"
          # Ad hoc signatures, nested code first; no entitlements (the
          # release entitlements name a Developer ID team).
          codesign --force --sign - "$APP/Contents/MacOS/cua-cursor-theme"
          codesign --force --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | tee release/codesign.txt
          grep -Fx "Identifier=$BUNDLE_ID" release/codesign.txt
          grep -Fx "Signature=adhoc" release/codesign.txt

      - name: Install the app where `cua-driver mcp` launches it from
        working-directory: libs/cua-driver/rust
        run: |
          test ! -e /Applications/CuaDriver.app || { echo "/Applications/CuaDriver.app already exists" >&2; exit 1; }
          sudo ditto release/CuaDriver.app /Applications/CuaDriver.app
          codesign --verify --strict /Applications/CuaDriver.app

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: End-to-end policy tests against the built app
        working-directory: libs/cua-driver/scripts/tests
        env:
          CUA_FIXED_POLICY_E2E: "1"
          CUA_FIXED_POLICY_E2E_LOGS: ${{ runner.temp }}/fixed-policy-e2e-logs
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.4
          # Apps launched through LaunchServices take launchd's environment:
          # no first-launch permission panel, no telemetry.
          launchctl setenv CUA_DRIVER_RS_PERMISSIONS_GATE 0
          launchctl setenv CUA_TELEMETRY 0
          launchctl setenv DO_NOT_TRACK 1
          python -m pytest -v -p no:cacheprovider test_fixed_policy_macos.py

      - name: Upload end-to-end driver logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixed-policy-e2e-logs
          path: ${{ runner.temp }}/fixed-policy-e2e-logs
          if-no-files-found: warn

      - name: Package
        working-directory: libs/cua-driver/rust
        run: |
          set -euo pipefail
          STAGE="cua-driver-rs-${RELEASE_TAG#cua-driver-rs-v}-darwin-universal"
          mkdir -p "release/$STAGE" dist
          cp release/universal/cua-driver release/universal/cua-cursor-theme "release/$STAGE/"
          cp -R release/CuaDriver.app "release/$STAGE/CuaDriver.app"
          cp ../../../LICENSE.md "release/$STAGE/LICENSE"
          cp THIRD_PARTY_NOTICES.md "release/$STAGE/THIRD_PARTY_NOTICES.md"
          COPYFILE_DISABLE=1 tar -czf "dist/$STAGE.tar.gz" -C release "$STAGE"
          (cd dist && shasum -a 256 -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-driver-fixed-policy-darwin-universal
          path: |
            libs/cua-driver/rust/dist/*.tar.gz
            libs/cua-driver/rust/dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish release
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
      id-token: write # keyless Sigstore signing
      attestations: write # build-provenance attestation
    env:
      RELEASE_TAG: ${{ needs.build-test.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cua-driver-fixed-policy-darwin-universal
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      # Same keyless bundles as the upstream release: <asset>.sigstore.json,
      # issued to this workflow at this ref.
      - name: Sigstore bundles
        working-directory: dist
        run: |
          set -euo pipefail
          for f in ./*.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
          ls -l

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Cua Driver ${RELEASE_TAG#cua-driver-rs-v} for macOS (universal), built with the
          \`fixed-policy\` feature from ${GITHUB_SHA}.

          - Ignores \`CUA_DRIVER_POLICY_FILE\` and \`CUA_DRIVER_MANAGED_POLICY_FILE\`; always loads
            \`~/.config/cua-driver/policy/policy.yaml\` and \`policy.rego\`, and serves a built-in
            locked policy when either is missing, a symbolic link or invalid.
          - Bundle id \`${BUNDLE_ID}\`, signed ad hoc (not notarized).
          - Verify with \`SHA256SUMS\`, the \`.sigstore.json\` bundles, or
            \`gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}\`.
          EOF
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file notes.md \
            --prerelease
